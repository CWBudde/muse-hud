name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (go vet + gofmt check)
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Smoke test
        run: |
          ./build/muse-hud version
          ./build/muse-hud print
